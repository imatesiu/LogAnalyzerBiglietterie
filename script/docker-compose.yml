services:
  viewer:
    build: .
    expose:
      - "5000"
    volumes:
      - ./xsd:/app/xsd:ro
      - ./uploads:/app/uploads
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  reverse-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - viewer
    ports:
      - "8443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/rtapp.isti.cnr.it/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - /etc/letsencrypt/live/rtapp.isti.cnr.it/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    restart: unless-stopped
